class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind ?? 'leon';
    const s = Number(this.props.size ?? 220) || 220;
    return {
      px: s + 'px',
      isVaca: k === 'vaca', isPerro: k === 'perro', isGato: k === 'gato', isLeon: k === 'leon',
      isPato: k === 'pato', isCerdo: k === 'cerdo', isOveja: k === 'oveja', isRana: k === 'rana',
      isElefante: k === 'elefante', isMono: k === 'mono', isPez: k === 'pez'
    };
  }
}
</script>
